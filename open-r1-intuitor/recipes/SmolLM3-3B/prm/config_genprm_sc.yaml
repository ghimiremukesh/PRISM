# Model arguments
model_name_or_path: HuggingFaceTB/SmolLM3-3B # use 3B for actual training
model_revision: main
torch_dtype: bfloat16
attn_implementation: flash_attention_2
# trust_remote_code: true

# Data training arguments
dataset_name: open-r1/DAPO-Math-17k-Processed #DigitalLearningGmbH/MATH-lighteval
dataset_config: en #default
dataset_prompt_column: prompt #problem
system_prompt: "You are a helpful AI Assistant, designed to provided well-reasoned and detailed responses. You FIRST think about the reasoning process step by step and then provide the user with the answer. Please enclose your final answer in the box: \\boxed{Your Answer}. Please stop generation immediately after outputing the box./no_think"

# GRPO trainer config
bf16: true
beta: 0.005 # kl penalty
use_vllm: true
do_eval: false
gradient_accumulation_steps: 36
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
hub_strategy: every_save
learning_rate: 3.0e-07
log_completions: true
log_level: info
logging_first_step: true
logging_steps: 5
logging_strategy: steps
lr_scheduler_type: cosine
max_prompt_length: 512
max_completion_length: 3076
max_steps: 300
num_generations: 6
num_train_epochs: 1
num_iterations: 1
output_dir: data/SmolLM3-3B-INT-PRM-DAPO
overwrite_output_dir: true
per_device_eval_batch_size: 4
per_device_train_batch_size: 4
push_to_hub: false
report_to:
- wandb
reward_funcs:
- accuracy 
reward_weights:
- 0.0 # Include accuracy reward for monitorying purpose, remove reward_funcs and reward_weights for open-generation RL
save_strategy: "steps"
save_total_limit: 6
save_steps: 10
seed: 7
warmup_ratio: 0.1
vllm_server_timeout: 600

include_intuitor: true
prm_model: GenPRM/GenPRM-7B
# vllm_server_port_prm: 8081
# vllm_server_host_prm: 127.0.0.1