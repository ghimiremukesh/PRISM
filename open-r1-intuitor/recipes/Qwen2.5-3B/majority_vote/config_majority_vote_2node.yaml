# Majority-vote (TTRL-style self-consistency) baseline — 2-node config.
# Adjusted for multi-node slurm: 1 node vLLM, 1 node training (8 GPUs).
# Original: 3 × 7 GPUs × 37 grad_acc = 777 completions/step (111 prompts).
# This:     3 × 8 GPUs × 35 grad_acc = 840 completions/step (120 prompts).
# (Exact match impossible with 8 GPUs; grad_acc must be multiple of num_generations=7.)

# Model arguments
model_name_or_path: Qwen/Qwen2.5-3B
model_revision: main
torch_dtype: bfloat16
attn_implementation: flash_attention_2

# Data training arguments
dataset_name: DigitalLearningGmbH/MATH-lighteval
dataset_config: default
dataset_prompt_column: problem
system_prompt: "You are a helpful AI Assistant, designed to provided well-reasoned and detailed responses. You FIRST think about the reasoning process step by step and then provide the user with the answer. Please enclose your final answer in the box: \\boxed{Your Answer}. Please stop generation immediately after outputing the box."

# GRPO trainer config
bf16: true
beta: 0.005 # kl penalty
use_vllm: true
do_eval: false
gradient_accumulation_steps: 35
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
hub_strategy: every_save
learning_rate: 3.0e-06
log_completions: true
log_level: info
logging_first_step: true
logging_steps: 5
logging_strategy: steps
lr_scheduler_type: cosine
max_prompt_length: 512
max_completion_length: 3072
max_steps: 300
num_generations: 7
num_train_epochs: 1
num_iterations: 1
output_dir: data/Qwen2.5-3B-MajorityVote-300steps-2node
overwrite_output_dir: true
per_device_eval_batch_size: 3
per_device_train_batch_size: 3
push_to_hub: false
report_to:
  - wandb

# Reward setup: train on the majority-vote pseudo-label; keep `accuracy` at
# weight 0.0 purely to log true accuracy alongside (it never affects training).
reward_funcs:
  - majority_vote
  - accuracy
reward_weights:
  - 1.0   # majority-vote pseudo-label (the learning signal)
  - 0.0   # ground-truth accuracy: MONITORING ONLY, no gradient
majority_vote_min_agreement: 0.0

save_strategy: "steps"
save_total_limit: 6
save_steps: 10
seed: 7
warmup_ratio: 0.1
